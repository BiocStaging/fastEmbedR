url: https://tkcaccia.github.io/fastEmbedR/
destination: _site

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]

home:
  title: fastEmbedR
  description: Native UMAP and interpolation-based t-SNE from data or precomputed nearest neighbors.

articles:
  - title: Start Here
    navbar: ~
    contents:
      - getting-started

reference:
  - title: t-SNE Embeddings
    desc: Native interpolation-based t-SNE, transform, and landmark workflows.
    contents:
      - tsne
      - tsne_knn
      - tsne_pca_init
      - prepare_tsne_knn
      - embed_knn
      - transform_tsne
      - landmark_tsne
  - title: UMAP Embeddings
    desc: Native UMAP embedding from data or precomputed nearest neighbors.
    contents:
      - umap
      - umap_knn
      - prepare_umap_knn
      - landmark_umap
  - title: Backend Configuration and Initialization
    desc: Select execution backends and construct package-native initializations.
    contents:
      - fastEmbedR_backend
      - fastEmbedR_capabilities
      - fastEmbedR_api
      - pca
      - tsne_pca_init
      - umap_init
  - title: Nearest-Neighbor Precomputation
    desc: Build reusable reference and query neighbor structures.
    contents:
      - precompute_knn
      - precompute_query_knn
  - title: Landmark Models
    desc: Select landmarks, fit reference embeddings, and project new samples.
    contents:
      - select_landmarks
      - fit_landmark_model
      - project_landmark_model
  - title: Graph Utilities
    desc: Construct and cluster graphs derived from data or embeddings.
    contents:
      - knn_graph
      - graph_cluster
  - title: Quality Metrics
    desc: Score local preservation, labels, and global structure.
    contents:
      - evaluate_embedding
