name: Feature request
description: Propose a focused API, backend, or documentation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Scientific or user need
      description: Explain the workflow that the feature would enable.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API and expected result, including affected backends.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Describe correctness, quality, memory, or performance checks.
